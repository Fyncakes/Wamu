<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Wamu — Sign in on this device</title>
<style>
  :root { --bg:#0b1f17; --card:#132a21; --text:#e8f5ef; --muted:#a8c4b6; --accent:#25d366; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background:
    radial-gradient(ellipse at top, #0d3b2e 0%, var(--bg) 55%);
    color: var(--text); margin:0; min-height:100vh; padding:24px; }
  .card { max-width:440px; margin:48px auto; text-align:center; }
  .brand { font-size:2.2rem; font-weight:800; margin:0 0 8px; }
  .tag { color: var(--muted); line-height:1.5; }
  a { color: var(--accent); }
</style>
</head><body><div class="card">
  <p class="brand">Wamu</p>
  <p class="tag">This is a sign-in code for another device.<br/>
  Open the Wamu app on this phone → <b>Scan to sign in</b>, and point it at the QR on your other device.<br/><br/>
  The code does not contain your password or phone number.</p>
  <p class="tag"><a href="/connect">Need to point the app at this server first?</a></p>
</div></body></html>
