# WAMU staging stack — Postgres + Redis + MinIO + API + Celery worker/beat
# From repo root:
#   cp infrastructure/.env.staging.example infrastructure/.env.staging
#   # edit MoMo keys in .env.staging
#   docker compose -f infrastructure/docker-compose.staging.yml --env-file infrastructure/.env.staging up -d --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wamu
      POSTGRES_PASSWORD: wamu
      POSTGRES_DB: wamu
    ports:
      - "5432:5432"
    volumes:
      - wamu_staging_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wamu -d wamu"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wamuadmin
      MINIO_ROOT_PASSWORD: wamusecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wamu_staging_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 wamuadmin wamusecret;
      mc mb -p local/wamu-media || true;
      # Do NOT open the bucket anonymously — use API/presigned URLs only.
      exit 0;
      "

  api:
    build:
      context: ../wamu-backend
      dockerfile: Dockerfile
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: postgresql+asyncpg://wamu:wamu@postgres:5432/wamu
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_ACCESS_KEY: wamuadmin
      S3_SECRET_KEY: wamusecret
      S3_BUCKET: wamu-media
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  # Optional TURN for MTN/Airtel CGNAT — enable with: --profile turn
  # Phones need a reachable TURN_URLS (LAN IP or public DNS), matching credentials.
  # Set TURN_EXTERNAL_IP to that same host IP so relay candidates are not Docker-private.
  #   python -m scripts.print_turn_env
  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6.2
    network_mode: bridge
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    environment:
      TURN_USERNAME: ${TURN_USERNAME:-wamu}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-staging-turn-change-me}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        USER="$${TURN_USERNAME}:$${TURN_CREDENTIAL}"
        EXTRA=""
        if [ -n "$${TURN_EXTERNAL_IP}" ]; then
          EXTRA="--external-ip=$${TURN_EXTERNAL_IP}"
          echo "coturn external-ip=$${TURN_EXTERNAL_IP}"
        else
          echo "WARNING: TURN_EXTERNAL_IP unset — relay candidates may be unreachable from phones"
        fi
        exec turnserver -n \
          --log-file=stdout \
          --listening-port=3478 \
          --listening-ip=0.0.0.0 \
          --min-port=49160 \
          --max-port=49200 \
          --fingerprint \
          --lt-cred-mech \
          --user="$${USER}" \
          --realm=wamu.local \
          --no-cli \
          --no-tls \
          --no-dtls \
          --no-multicast-peers \
          $${EXTRA}

  worker:
    build:
      context: ../wamu-backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app.celery_app worker -l info
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: postgresql+asyncpg://wamu:wamu@postgres:5432/wamu
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_ACCESS_KEY: wamuadmin
      S3_SECRET_KEY: wamusecret
      S3_BUCKET: wamu-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  beat:
    build:
      context: ../wamu-backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app.celery_app beat -l info
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: postgresql+asyncpg://wamu:wamu@postgres:5432/wamu
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  wamu_staging_pg:
  wamu_staging_minio:
