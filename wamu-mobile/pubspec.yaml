name: wamu_mobile
description: WAMU Uganda Super App — Connect. Discover. Do More.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  web_socket_channel: ^3.0.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  http_parser: ^4.1.2
  path: ^1.9.1
  flutter_webrtc: ^1.6.2+hotfix.1
  connectivity_plus: ^7.3.1
  image: ^4.9.2
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  drift: ^2.35.0
  sqlite3: ^3.5.2
  firebase_core: ^4.4.0
  firebase_messaging: ^16.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  video_player: ^2.10.0
  file_picker: ^8.3.7
  geolocator: ^14.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  pointer_interceptor: ^0.10.1+3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/playstore.png
  image_path_android: assets/branding/playstore.png
  image_path_ios: assets/branding/appstore.png
  adaptive_icon_background: "#0C1C39"
  adaptive_icon_foreground: assets/branding/playstore.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/playstore.png
    background_color: "#0C1C39"
    theme_color: "#0C1C39"
  macos:
    generate: true
    image_path: assets/branding/appstore.png

# Bundle SQLite3MultipleCiphers for at-rest encryption (PRAGMA key).
# See: https://drift.simonbinder.eu/docs/platforms/encryption/
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  assets:
    - assets/themes/
    - assets/businesses/
    - assets/products/
    - assets/sounds/
    - assets/branding/
